import groovy.json.JsonOutput

// Resolves actual packaged dependencies, not every artifact in the local cache.
gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    app.tasks.register('writeRuntimeLicenseInputs') {
        doLast {
            def rows = []
            ['debugRuntimeClasspath', 'releaseRuntimeClasspath', 'coreLibraryDesugaring'].each { name ->
                def artifacts = app.configurations.getByName(name).incoming.artifactView {
                    componentFilter { id -> id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
                }.artifacts.artifacts
                artifacts.each { artifact ->
                    def id = artifact.id.componentIdentifier
                    rows << [configuration: name, group: id.group, module: id.module, version: id.version,
                             file: artifact.file.absolutePath, extension: artifact.file.name.tokenize('.').last()]
                }
            }
            def output = new File(gradle.rootProject.layout.buildDirectory.get().asFile, 'runtime-license-inputs.json')
            output.parentFile.mkdirs()
            output.text = JsonOutput.prettyPrint(JsonOutput.toJson(rows))
            println "Runtime license inputs: ${output}"
        }
    }
}
